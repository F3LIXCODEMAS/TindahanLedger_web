<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1160" viewBox="0 0 1700 1160" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4.4. Main TindahanLedger application workflow</title>
  <desc id="desc">The flowchart shows owner login and role checks, owner operations for credit, payments, cash purchases, and points redemption, plus the separate customer QR read-only portal.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M1,1 L10,5 L1,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 26px; font-weight: 700; }
      .process { fill: #f4f7fb; stroke: #1d4d7a; stroke-width: 2.2; rx: 15; }
      .decision { fill: #fff8e6; stroke: #9a6700; stroke-width: 2.2; }
      .terminal { fill: #eaf7ed; stroke: #2f6d3b; stroke-width: 2.2; }
      .label { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .small { font-size: 13px; text-anchor: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .note { font-size: 13px; fill: #475569; }
    </style>
  </defs>
  <rect width="1700" height="1160" fill="#ffffff"/>
  <text class="title" x="850" y="44" text-anchor="middle">Main TindahanLedger application workflow</text>
  <ellipse class="terminal" cx="850" cy="105" rx="90" ry="33"/><text class="label" x="850" y="111">Start</text>
  <rect class="process" x="700" y="160" width="300" height="72"/><text class="label" x="850" y="190"><tspan x="850">Store Owner enters</tspan><tspan x="850" dy="22">login credentials</tspan></text>
  <polygon class="decision" points="850,255 1000,315 850,375 700,315"/><text class="label" x="850" y="310"><tspan x="850">Valid, active,</tspan><tspan x="850" dy="22">authorized account?</tspan></text>
  <rect class="process" x="120" y="280" width="300" height="72"/><text class="label" x="270" y="310"><tspan x="270">Reject login</tspan><tspan x="270" dy="22">and display error</tspan></text>
  <path class="line" d="M700 315 H430"/>
  <rect class="process" x="700" y="410" width="300" height="72"/><text class="label" x="850" y="440"><tspan x="850">Handle required temporary</tspan><tspan x="850" dy="22">password change, if needed</tspan></text>
  <path class="line" d="M850 375 V404"/>
  <rect class="process" x="700" y="520" width="300" height="72"/><text class="label" x="850" y="563">Open owner dashboard</text>
  <path class="line" d="M850 482 V514"/>
  <polygon class="decision" points="850,620 1060,690 850,760 640,690"/><text class="label" x="850" y="685"><tspan x="850">Select owner</tspan><tspan x="850" dy="22">workflow</tspan></text>
  <path class="line" d="M850 592 V612"/>

  <rect class="process" x="75" y="835" width="350" height="105"/><text class="label" x="250" y="870"><tspan x="250">Credit</tspan><tspan class="small" x="250" dy="25">Validate customer, limit, items, and idempotency;</tspan><tspan class="small" x="250" dy="20">save ledger and optional purchase atomically</tspan></text>
  <rect class="process" x="485" y="835" width="350" height="105"/><text class="label" x="660" y="870"><tspan x="660">Cash payment</tspan><tspan class="small" x="660" dy="25">Allocate oldest unpaid entries; update balance;</tspan><tspan class="small" x="660" dy="20">award eligible points and complete cycle</tspan></text>
  <rect class="process" x="895" y="835" width="350" height="105"/><text class="label" x="1070" y="870"><tspan x="1070">Cash purchase</tspan><tspan class="small" x="1070" dy="25">Validate catalog and reviewed total; store</tspan><tspan class="small" x="1070" dy="20">purchase snapshots; no debt/points change</tspan></text>
  <rect class="process" x="1305" y="835" width="320" height="105"/><text class="label" x="1465" y="870"><tspan x="1465">Suki Points redemption</tspan><tspan class="small" x="1465" dy="25">Check points/debt; atomically record</tspan><tspan class="small" x="1465" dy="20">non-cash allocation and point deduction</tspan></text>
  <path class="line" d="M700 690 H250 V827"/><path class="line" d="M780 750 V827"/>
  <path class="line" d="M920 750 V800 H1070 V827"/><path class="line" d="M1000 690 H1465 V827"/>

  <rect class="process" x="485" y="980" width="730" height="70"/><text class="label" x="850" y="1009"><tspan x="850">Show confirmation and updated balance</tspan><tspan class="small" x="850" dy="22">Attempt configured credit/payment receipt after commit; failure does not undo the financial transaction</tspan></text>
  <path class="line" d="M250 940 V965 H610 V972"/><path class="line" d="M660 940 V972"/><path class="line" d="M1070 940 V965 H1090 V972"/><path class="line" d="M1465 940 V965 H1150 V972"/>

  <rect class="process" x="75" y="505" width="420" height="135"/><text class="label" x="285" y="540"><tspan x="285">Other owner workflows</tspan><tspan class="small" x="285" dy="25">Customer/product management, QR credential control,</tspan><tspan class="small" x="285" dy="20">email/penalty settings, overdue views, analytics,</tspan><tspan class="small" x="285" dy="20">and advisory recommendations</tspan></text>
  <path class="line" d="M640 690 H520 V640"/>
  <ellipse class="terminal" cx="285" cy="130" rx="150" ry="28"/><text class="label" x="285" y="136">Super Admin starts separately</text>
  <rect class="process" x="75" y="170" width="420" height="72"/><text class="label" x="285" y="200"><tspan x="285">Enter credentials; verify active</tspan><tspan x="285" dy="22">Super Admin role</tspan></text>
  <rect class="process" x="75" y="270" width="420" height="72"/><text class="label" x="285" y="300"><tspan x="285">Change temporary password</tspan><tspan x="285" dy="22">when required</tspan></text>
  <rect class="process" x="75" y="370" width="420" height="92"/><text class="label" x="285" y="404"><tspan x="285">Open Super Admin dashboard;</tspan><tspan x="285" dy="22">manage stores/users and review</tspan><tspan x="285" dy="22">platform monitoring/analytics</tspan></text>
  <path class="line" d="M285 158 V164"/><path class="line" d="M285 242 V264"/><path class="line" d="M285 342 V364"/>

  <ellipse class="terminal" cx="1450" cy="125" rx="125" ry="30"/><text class="label" x="1450" y="131">Customer starts separately</text>
  <rect class="process" x="1280" y="185" width="340" height="78"/><text class="label" x="1450" y="215"><tspan x="1450">Scan issued QR or open</tspan><tspan x="1450" dy="22">the bearer-token link</tspan></text>
  <polygon class="decision" points="1450,290 1600,345 1450,400 1300,345"/><text class="label" x="1450" y="340"><tspan x="1450">Credential valid</tspan><tspan x="1450" dy="22">and store active?</tspan></text>
  <rect class="process" x="1280" y="435" width="340" height="82"/><text class="label" x="1450" y="466"><tspan x="1450">Start protected session;</tspan><tspan x="1450" dy="22">display read-only ledger</tspan></text>
  <rect class="process" x="1280" y="555" width="340" height="70"/><text class="label" x="1450" y="598">Deny portal access</text>
  <path class="line" d="M1450 155 V179"/>
  <path class="line" d="M1450 263 V282"/>
  <path class="line" d="M1400 395 V428"/>
  <path class="line" d="M1500 395 V520 H1450 V548"/>
  <text class="small" x="1363" y="420">Yes</text>
  <text class="small" x="1520" y="510">No</text>
  <text class="note" x="55" y="1090">Source: verified authentication, credit, payment, cash-purchase, redemption, QR-portal, and Super Admin workflows. This is a high-level system flow, not a screen mockup.</text>
  <text class="note" x="55" y="1115">Caption: Figure 4.4. Main TindahanLedger application workflow.</text>
</svg>
